name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            cli_target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            cli_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            cli_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            cli_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — tauri-action signs each bundle with this key and
          # emits the latest.json the in-app updater polls. Must match the
          # pubkey baked into tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing — tauri-action imports this cert into a
          # throwaway keychain. Empty on Linux/Windows runners, where these
          # are simply ignored.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Notarization — required for Developer ID builds to pass Gatekeeper.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Papr ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # ---------------------------------------------------------------------
      # papr CLI — built from the same workspace, signed/notarized on macOS,
      # and uploaded to the same draft release tauri-action just created.
      # ---------------------------------------------------------------------
      - name: Add Rust target for the CLI
        run: rustup target add ${{ matrix.cli_target }}

      - name: Build papr CLI
        run: cargo build --release -p papr-cli --target ${{ matrix.cli_target }}

      - name: Sign & notarize papr CLI (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.cli_target }}/release/papr"

          # tauri-action tears down its own keychain after its step, so stand up
          # a fresh one to sign the bare CLI binary with the Developer ID cert.
          KEYCHAIN="$RUNNER_TEMP/papr-cli.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          # Scrub the decoded cert + temp keychain on any exit path.
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERT_PATH" "$RUNNER_TEMP/papr-cli.zip"
          }
          trap cleanup EXIT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          # Hardened runtime + secure timestamp, same posture as the app bundle.
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          # Notarize. A bare executable can't be stapled (stapling needs an
          # app/dmg/pkg container), so we submit a zip of the binary; the ticket
          # binds to the code signature's cdhash and Gatekeeper checks it online.
          ditto -c -k "$BIN" "$RUNNER_TEMP/papr-cli.zip"
          xcrun notarytool submit "$RUNNER_TEMP/papr-cli.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait

      - name: Package CLI (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          set -euo pipefail
          tar -czf "papr-${{ matrix.cli_target }}.tar.gz" \
            -C "target/${{ matrix.cli_target }}/release" papr

      - name: Package CLI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.cli_target }}/release/papr.exe" `
            -DestinationPath "papr-${{ matrix.cli_target }}.zip" -Force

      - name: Upload CLI to the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through env, not interpolated into the script, so a crafted
          # tag name can't break out into shell syntax (template injection).
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Exactly one of .tar.gz (Unix) / .zip (Windows) exists for this target.
          asset=$(echo papr-${{ matrix.cli_target }}.*)
          gh release upload "$RELEASE_TAG" "$asset" --clobber --repo "$GH_REPO"

  finalize-appimage:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: AppImage -- prune host-coupled libs, repack, re-sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # All matrix uploads have finished, so latest.json cannot be replaced
          # by another platform while we patch its Linux signatures.
          mkdir -p target/release/bundle/appimage
          gh release download "$RELEASE_TAG" --pattern '*.AppImage' \
            --dir target/release/bundle/appimage --repo "$GH_REPO"
          shopt -s nullglob
          images=(target/release/bundle/appimage/*.AppImage)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Linux AppImage"
            exit 1
          fi
          appimage="${images[0]}"
          appdir="$(dirname "$appimage")"
          appname="$(basename "$appimage")"

          # tauri-bundler has no "exclude library" setting, so post-process the
          # artifact: unpack it, drop the host-coupled libs, repack with the
          # stock tool. The app then links the host's libwayland, exactly like
          # the .deb does.
          chmod +x "$appimage"
          ./"$appimage" --appimage-extract >/dev/null
          find squashfs-root -name 'libwayland-*.so*' -delete

          # The hook forces x11 and clobbers a GDK_BACKEND the user exported.
          # Let an explicit one through, now that native Wayland works here;
          # warn instead of failing if upstream ever moves that line.
          hook="squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          if grep -q '^export GDK_BACKEND=x11' "$hook"; then
            # Expand in AppRun, not during packaging.
            # shellcheck disable=SC2016
            sed -i 's|^export GDK_BACKEND=x11|export GDK_BACKEND="${GDK_BACKEND:-x11}"|' "$hook"
          else
            echo "::warning::GDK_BACKEND no longer hardcoded in $hook; skipping that tweak"
          fi

          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          # --appimage-extract-and-run: the runner has no usable FUSE.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            squashfs-root "$appdir/repacked.AppImage"
          mv "$appdir/repacked.AppImage" "$appimage"

          # Assert the invariant against the file we are about to ship, so a
          # future tauri-bundler change fails here instead of shipping silently.
          rm -rf squashfs-root
          ./"$appimage" --appimage-extract >/dev/null
          test -d squashfs-root/usr
          if find squashfs-root -name 'libwayland-*.so*' | grep -q .; then
            echo "::error::$appname still bundles libwayland-*"
            find squashfs-root -name 'libwayland-*.so*'
            exit 1
          fi
          rm -rf squashfs-root

          # Repacking changed the bytes, so the signature tauri-action produced
          # for the previous file is stale: regenerate it with the same key.
          pnpm tauri signer sign "$appimage"

          # latest.json embeds that signature for every AppImage platform key
          # (linux-x86_64, linux-x86_64-appimage), so patch and re-upload it,
          # otherwise the in-app updater rejects the release.
          gh release download "$RELEASE_TAG" --pattern latest.json \
            --clobber --repo "$GH_REPO"
          jq --arg sig "$(cat "$appimage.sig")" \
            '.platforms |= with_entries(if (.value.url // "") | test("AppImage$") then .value.signature = $sig else . end)' \
            latest.json > latest.patched.json
          mv latest.patched.json latest.json
          gh release upload "$RELEASE_TAG" \
            "$appimage" "$appimage.sig" latest.json \
            --clobber --repo "$GH_REPO"
